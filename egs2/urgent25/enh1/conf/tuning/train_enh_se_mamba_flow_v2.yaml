use_amp: false
optim: adamW
init: none
unused_parameters: true
max_epoch: 600
batch_type: folded
batch_size: 16
iterator_type: chunk
chunk_length: 300 # 4s # 8s
chunk_default_fs: 50 # GCD among all possible sampling frequencies
num_cache_chunks: 128

chunk_max_abs_length: 100000 # max number of samples per chunk for all sampling frequencies (reduce this value if OOM occurs)
num_iters_per_epoch: 8000
num_workers: 16
grad_clip: 1.0
optim_conf:
    lr: 5.0e-04
    betas: [0.8, 0.999]
    eps: 1.0e-10
    weight_decay: 1.0e-05
patience: 40
val_scheduler_criterion:
- valid
- loss
best_model_criterion:
-   - valid
    - loss
    - min
keep_nbest_models: 5
scheduler: steplr
scheduler_conf:
    step_size: 4
    gamma: 0.99

allow_multi_rates: true

preprocessor: enh
preprocessor_conf:
    speech_volume_normalize: "0.5_1.0"
    rir_scp: dump/raw/rir_train.scp
    rir_apply_prob: 0.5
    noise_scp: dump/raw/noise_train.scp
    noise_apply_prob: 1.0
    noise_db_range: "-5_15"
    force_single_channel: true
    channel_reordering: true
    # The categories list order must be the same everywhere in this config
    categories: &categories
    - 1ch_8000Hz
    - 1ch_16000Hz
    - 1ch_22050Hz
    - 1ch_24000Hz
    - 1ch_32000Hz
    - 1ch_44100Hz
    - 1ch_48000Hz
    - 1ch_8000Hz_reverb
    - 1ch_16000Hz_reverb
    - 1ch_22050Hz_reverb
    - 1ch_24000Hz_reverb
    - 1ch_32000Hz_reverb
    - 1ch_44100Hz_reverb
    - 1ch_48000Hz_reverb
    data_aug_effects:   # no need to set the "sample_rate" argument for each effect here
    - [1.0, "bandwidth_limitation", {"res_type": "random"}]
    - [1.0, "clipping", {"min_quantile": 0.1, "max_quantile": 0.9}]
    - [1.0, [[0.5, "codec", {"format": "mp3", "encoder": null, "qscale": [1, 10]}], [0.5, "codec", {"format": "ogg", "encoder": ["vorbis", "opus"], "qscale": [-1, 10]}]]]
    - [1.0, "packet_loss", {"packet_duration_ms": 20, "packet_loss_rate": [0.05, 0.25], "max_continuous_packet_loss": 10}]
    data_aug_num: [1, 3]  # at most 1 augmentation per sample
    data_aug_prob: 0.75
num_spk: 1

model_conf:
    normalize_variance_per_ch: true
    #always_forward_in_48k: true
    # The categories list order must be the same everywhere in this config
    categories: *categories

encoder: stft
encoder_conf:
    n_fft: 256
    hop_length: 128
    use_builtin_complex: true
    default_fs: 8000
    spec_transform_type: exponent
    spec_factor: 0.33
    spec_abs_exponent: 0.3 # keep as in the original SEMambaSeparator
decoder: stft
decoder_conf:
    n_fft: 256
    hop_length: 128
    default_fs: 8000
    spec_transform_type: exponent
    spec_factor: 0.33
    spec_abs_exponent: 0.3 # keep as in the original SEMambaSeparator

diffusion_model: flow
diffusion_model_conf:
    estimator_model: se_mamba
    estimator_model_conf:
        n_srcs: 1
        mamba_blocks: 10
        mamba_layers: 2
        lstm_hidden_units: 200
        attn_n_head: 4
        attn_qk_output_channel: 2
        emb_dim: 48
        emb_ks: 4
        emb_hs: 1
        activation: prelu
        eps: 1.0e-05
        conditional_norm_type: adaptive_rms_norm
        condition_dim: 1024
    flow: optimal_transport_flow
    flow_conf:
        sigma_start: 1.0
        sigma_end: 1.0e-4
    loss_type: "mse"
    sampler: cfm_euler
    sampler_conf:
        time_min: 1.0e-8
        time_max: 1.0
        num_steps: 5

# A list for criterions
# The overlall loss in the multi-task learning will be:
# loss = weight_1 * loss_1 + ... + weight_N * loss_N
# The default `weight` for each sub-loss is 1.0
criterions:
  # The first criterion
  - name: mr_l1_tfd
    conf:
      window_sz: [256, 512, 768, 1024]
      hop_sz: null
      eps: 1.0e-9
      time_domain_weight: 0.5
      normalize_variance: true
      reduction: mean
    wrapper: fixed_order
    wrapper_conf:
      weight: 1.0
  # The second criterion
  - name: si_snr
    conf:
      eps: 1.0e-7
    wrapper: fixed_order
    wrapper_conf:
      weight: 0.0
